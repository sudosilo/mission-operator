<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f7fc">
<title>Mission Operator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f3f7fc; --panel:#ffffff; --panel2:#eef3fa; --border:#d3deec; --text:#1f2a37; --dim:#6b7a8c;
  --blue:#1e6fd9; --blueFaint:rgba(30,111,217,0.10); --green:#14995a; --amber:#c97a00; --red:#d6304a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Courier New",ui-monospace,monospace;font-size:12px;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);gap:10px}
.brand{font-weight:900;font-size:14px;letter-spacing:4px;color:var(--blue);white-space:nowrap}
.brand span{color:var(--amber)}
.gps{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.dot{width:7px;height:7px;border-radius:50%;background:var(--amber);display:inline-block}
.dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
.score{font-weight:900;font-size:14px;color:var(--amber);white-space:nowrap}
.tabs{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--panel2);border-bottom:1px solid var(--border);gap:6px}
.tablist{display:flex;gap:4px;overflow-x:auto}
.tab{font-size:10px;letter-spacing:2px;padding:5px 10px;border-radius:3px;border:1px solid transparent;color:var(--dim);cursor:pointer;white-space:nowrap;background:none;font-family:inherit}
.tab.on{color:var(--blue);border-color:var(--blue);background:var(--blueFaint)}
.scan{background:var(--panel);border:1px solid var(--blue);color:var(--blue);font-family:inherit;font-size:10px;letter-spacing:2px;padding:5px 12px;border-radius:3px;cursor:pointer;white-space:nowrap}
.scan.busy{border-color:var(--amber);color:var(--amber)}
.main{flex:1;display:grid;grid-template-columns:210px 1fr;overflow:hidden}
.side{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.label{font-size:9px;letter-spacing:3px;color:var(--blue);padding:8px 10px;border-bottom:1px solid var(--border)}
.sigs{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:4px}
.sig{background:var(--panel2);border:1px solid var(--border);border-left:3px solid;border-radius:3px;padding:5px 8px 7px;position:relative;cursor:pointer;user-select:none}
.sig.off{opacity:.4}
.sig b{display:block;font-size:10px;letter-spacing:1px;color:var(--text)}
.sig i{font-style:normal;font-size:8px}
.sig s{text-decoration:none;font-size:8px;color:var(--dim);margin-left:4px}
.sig em{position:absolute;right:8px;top:7px;font-style:normal;font-weight:700;font-size:12px}
.bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--border);overflow:hidden;border-radius:0 0 3px 3px}
.bar div{height:100%;width:0}
.session{border-top:1px solid var(--border);padding:8px 10px}
.row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--panel2);font-size:10px}
.row span:first-child{color:var(--dim)}
.row span:last-child{font-weight:700}
.view{position:relative;overflow:hidden;background:#fbfdff}
.pane{position:absolute;inset:0;overflow-y:auto;padding:14px;display:none}
.pane.on{display:block}
#mapPane{padding:0;overflow:hidden}
#map{position:absolute;inset:0;background:#eef2f6}
.acq{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--amber);font-size:11px;letter-spacing:2px;background:var(--panel);border:1px solid var(--border);padding:10px 14px;border-radius:4px;z-index:500}
.acq small{display:block;font-size:8px;color:var(--dim);margin-top:4px}
.recenter{position:absolute;right:10px;bottom:16px;z-index:500;background:var(--panel);border:1px solid var(--blue);color:var(--blue);font-family:inherit;font-size:10px;letter-spacing:2px;padding:6px 10px;border-radius:3px;cursor:pointer}
.toasts{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:270px;max-width:90%;display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:600}
.toast{background:var(--panel);border:1px solid;border-left:3px solid;padding:5px 10px;font-size:9px;border-radius:3px;display:flex;justify-content:space-between;gap:8px;box-shadow:0 2px 6px rgba(31,42,55,.08)}
.toast span:last-child{font-weight:700;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:12px;max-width:640px;margin:0 auto 12px}
.card h3{font-size:10px;letter-spacing:3px;color:var(--blue);margin-bottom:8px;font-weight:700}
.log{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--panel2);gap:10px}
.log b{font-size:11px}
.log small{display:block;color:var(--dim);font-size:9px;margin-top:2px}
.chip{display:inline-block;font-size:8px;letter-spacing:1px;padding:1px 5px;border-radius:2px;color:#fff;margin-right:6px;vertical-align:middle}
.badge{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--panel2);opacity:.45}
.badge.got{opacity:1}
.medal{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--dim);flex-shrink:0}
.badge.got .medal{border-color:var(--amber);color:var(--amber);background:#fff7e6}
.badge b{font-size:11px}
.badge small{display:block;color:var(--dim);font-size:9px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--panel2);gap:10px}
select,.btn{font-family:inherit;font-size:11px;padding:5px 8px;border:1px solid var(--border);border-radius:3px;background:var(--panel);color:var(--text)}
.btn{cursor:pointer;color:var(--red);border-color:var(--red)}
.empty{color:var(--dim);font-size:11px;padding:10px 0}
.leaflet-popup-content{font-family:"Courier New",monospace;font-size:11px;margin:8px 10px}
.leaflet-control-attribution{font-size:8px}
@media (max-width:640px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{border-right:none;border-top:1px solid var(--border);order:2;max-height:132px}
  .side>.label{display:none}
  .sigs{flex-direction:row;overflow-x:auto;overflow-y:hidden;flex:none;padding:6px}
  .sig{min-width:118px}
  .session{display:none}
  .gps .coords{display:none}
  .top{padding:7px 10px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">MISSION <span>OPR</span></div>
    <div class="gps"><span class="dot" id="gpsDot"></span><span id="gpsText">ACQUIRING GPS</span></div>
    <div class="score" id="score">0 PTS</div>
  </div>
  <div class="tabs">
    <div class="tablist" id="tabs"></div>
    <button class="scan" id="scanBtn">[ SCAN ]</button>
  </div>
  <div class="main">
    <div class="side">
      <div class="label">// LAYERS  TAP TO TOGGLE</div>
      <div class="sigs" id="sigs"></div>
      <div class="session">
        <div class="label" style="padding:0 0 6px;border:none">// SESSION</div>
        <div id="sessionRows"></div>
      </div>
    </div>
    <div class="view">
      <div class="pane on" id="mapPane">
        <div id="map"></div>
        <div class="acq" id="acq">ACQUIRING GPS<small>ALLOW LOCATION ACCESS</small></div>
        <button class="recenter" id="recenter">CENTER</button>
        <div class="toasts" id="toasts"></div>
      </div>
      <div class="pane" id="logPane"></div>
      <div class="pane" id="badgePane"></div>
      <div class="pane" id="setPane"></div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var VERSION = "v2026.10.15.2";
  var KEY = "mission-operator-v3";
  var DAILY_SCANS = 25;

  // Every layer. group = which relay call feeds it. every = seconds between refreshes.
  var LAYERS = [
    {key:"aircraft", label:"AIRCRAFT", pts:"+30 TO 80", color:"#d6304a", group:"aircraft", shape:"arrow"},
    {key:"ships", label:"SHIPS (AIS)", pts:"+35", color:"#0b9c8f", group:"ships", shape:"arrow", value:35},
    {key:"ports", label:"PORTS", pts:"+30", color:"#1b7f9e", group:"osm_port", value:30},
    {key:"cell", label:"CELL TOWERS", pts:"+25", color:"#c97a00", group:"osm_cell", value:25},
    {key:"rail", label:"RAIL STATIONS", pts:"+20", color:"#7b3fd1", group:"osm_rail", value:20},
    {key:"portal", label:"PORTALS", pts:"+10", color:"#b8960a", group:"osm_portal", value:10},
    {key:"mesh", label:"MESHTASTIC", pts:"+40", color:"#0f8f6f", group:"mesh", value:40},
    {key:"weather", label:"WEATHER STATIONS", pts:"+15", color:"#d46a00", group:"weather", value:15},
    {key:"starlink", label:"STARLINK", pts:"+15", color:"#4f6fd8", group:"sats", value:15},
    {key:"gps_sat", label:"GPS SATS", pts:"+20", color:"#4c9a12", group:"sats", value:20},
    {key:"weather_sat", label:"WEATHER SATS", pts:"+20", color:"#2a8fc7", group:"sats", value:20},
    {key:"debris", label:"DEBRIS", pts:"+25", color:"#b5523b", group:"sats", value:25},
    {key:"rocket", label:"ROCKET BODIES", pts:"+30", color:"#c23f7a", group:"sats", value:30},
    {key:"wifi", label:"WI-FI (SCAN)", pts:"+5 TO 15", color:"#14995a", group:"manual"},
    {key:"bt", label:"BLUETOOTH (SCAN)", pts:"+5 TO 20", color:"#1e6fd9", group:"manual"}
  ];
  var BY = {}; LAYERS.forEach(function(l){ BY[l.key] = l; });

  var GROUPS = {
    aircraft:   {every:20,  layers:["aircraft"]},
    ships:      {every:90,  layers:["ships"]},
    osm_port:   {every:3600,layers:["ports"]},
    osm_cell:   {every:600, layers:["cell"]},
    osm_rail:   {every:1800,layers:["rail"]},
    osm_portal: {every:600, layers:["portal"]},
    mesh:       {every:300, layers:["mesh"]},
    weather:    {every:600, layers:["weather"]},
    sats:       {every:180, layers:["starlink","gps_sat","weather_sat","debris","rocket"]}
  };

  var TABS = ["MAP","LOGBOOK","BADGES","SETTINGS"];

  function fresh(){
    var on = {}; LAYERS.forEach(function(l){ on[l.key] = true; });
    return {score:0, log:[], seen:{}, seenOrder:[], totals:{}, dist:0, scans:{day:"", n:0}, on:on, nm:60, air:20, follow:true};
  }
  function load(){
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s){ var f = fresh(); for (var k in f) if (s[k] === undefined) s[k] = f[k]; LAYERS.forEach(function(l){ if (s.on[l.key] === undefined) s.on[l.key] = true; }); return s; }
    } catch(e){}
    return fresh();
  }
  var S = load();
  var saveT = null;
  function save(){ clearTimeout(saveT); saveT = setTimeout(function(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }, 400); }

  var $ = function(id){ return document.getElementById(id); };
  var loc = null, lastPos = null, tab = "MAP", scanning = false;
  var data = {}, status = {}, missing = {}, session = {score:0, finds:0, start:Date.now(), dist:0};
  var last = {}, busy = {};
  LAYERS.forEach(function(l){ data[l.key] = []; status[l.key] = "WAIT"; });
  GROUPS.aircraft.every = S.air;

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  // ---------- map ----------
  var map = L.map("map", {zoomControl:false, attributionControl:true}).setView([36.17, -115.14], 11);
  L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {maxZoom:17, attribution:"OpenTopoMap, OpenStreetMap"}).addTo(map);
  var groups = {};
  LAYERS.forEach(function(l){ groups[l.key] = L.layerGroup(); if (S.on[l.key]) groups[l.key].addTo(map); });
  var me = null;
  map.on("dragstart", function(){ if (S.follow){ S.follow = false; save(); } });
  $("recenter").onclick = function(){ S.follow = true; save(); if (loc) map.setView([loc.lat, loc.lon], Math.max(map.getZoom(), 11)); };

  function arrowIcon(color, heading){
    return L.divIcon({className:"", iconSize:[18,18], iconAnchor:[9,9],
      html:'<svg width="18" height="18" viewBox="-9 -9 18 18" style="transform:rotate('+(heading||0)+'deg)"><polygon points="0,-8 5,6 0,3 -5,6" fill="'+color+'" stroke="#fff" stroke-width="1"/></svg>'});
  }
  function meIcon(){
    return L.divIcon({className:"", iconSize:[24,24], iconAnchor:[12,12],
      html:'<svg width="24" height="24" viewBox="-12 -12 24 24"><circle r="9" fill="rgba(201,122,0,0.15)" stroke="#c97a00" stroke-width="2"/><circle r="3" fill="#c97a00"/><path d="M0 -12V-8M0 8V12M-12 0H-8M8 0H12" stroke="#c97a00" stroke-width="1.5"/></svg>'});
  }

  function popup(l, it){
    var h = '<b style="color:'+l.color+'">'+esc(l.label)+'</b><br>'+esc(it.name || it.callsign || it.id);
    if (it.alt != null && l.key === "aircraft") h += '<br>'+(it.alt === 0 ? "GROUND" : it.alt.toLocaleString()+" FT")+(it.type ? " &middot; "+esc(it.type) : "");
    if (it.alt != null && l.group === "sats") h += '<br>'+it.alt.toLocaleString()+" KM UP";
    if (l.key === "ships" && it.speed != null) h += '<br>'+it.speed+" KN";
    if (l.key === "weather" && it.tempF != null) h += '<br>'+it.tempF+"&deg;F"+(it.wind != null ? " &middot; WIND "+it.wind+" MPH" : "")+(it.humidity != null ? " &middot; RH "+it.humidity+"%" : "")+(it.desc ? "<br>"+esc(it.desc) : "");
    return h;
  }

  function draw(key){
    var l = BY[key], g = groups[key];
    g.clearLayers();
    data[key].forEach(function(it){
      var m = l.shape === "arrow"
        ? L.marker([it.lat, it.lon], {icon:arrowIcon(l.color, it.heading)})
        : L.circleMarker([it.lat, it.lon], {radius:5, color:"#fff", weight:1, fillColor:l.color, fillOpacity:.9});
      m.bindPopup(popup(l, it));
      g.addLayer(m);
    });
  }

  // ---------- scoring ----------
  function toast(msg, pts, color){
    var d = document.createElement("div");
    d.className = "toast";
    d.style.borderColor = color;
    d.innerHTML = '<span>'+esc(msg)+'</span><span style="color:'+color+'">'+pts+'</span>';
    var box = $("toasts");
    box.insertBefore(d, box.firstChild);
    while (box.children.length > 5) box.removeChild(box.lastChild);
    setTimeout(function(){ d.remove(); }, 3200);
  }

  function pointsFor(l, it){
    if (l.key === "aircraft") return it.alt > 30000 ? 30 : it.alt > 10000 ? 55 : 80;
    if (l.key === "wifi") return 5 + Math.floor(Math.random() * 11);
    if (l.key === "bt") return 5 + Math.floor(Math.random() * 16);
    return l.value || 10;
  }

  function award(key, it){
    var id = key + ":" + it.id;
    if (S.seen[id]) return;
    var l = BY[key], pts = pointsFor(l, it);
    S.seen[id] = 1; S.seenOrder.push(id);
    if (S.seenOrder.length > 20000){ delete S.seen[S.seenOrder.shift()]; }
    S.score += pts; session.score += pts; session.finds++;
    S.totals[key] = (S.totals[key] || 0) + 1;
    S.log.unshift({k:key, name:it.name || it.callsign || String(it.id), alt:it.alt, pts:pts, t:Date.now()});
    if (S.log.length > 400) S.log.length = 400;
    toast(l.label + " " + (it.name || it.callsign || it.id), "+" + pts, l.color);
  }

  // ---------- relay calls ----------
  function q(){ return "lat=" + loc.lat.toFixed(3) + "&lon=" + loc.lon.toFixed(3); }
  function get(url){ return fetch(url).then(function(r){ return r.json(); }); }

  function setLayer(key, list, err){
    if (err){ status[key] = err; renderSide(); return; }
    data[key] = list.filter(function(i){ return typeof i.lat === "number" && typeof i.lon === "number"; });
    status[key] = "OK";
    data[key].forEach(function(it){ award(key, it); });
    draw(key);
  }

  function errOf(d){
    if (!d) return "ERROR";
    if (d.error === "key"){ missing[d.missing] = true; return "NO KEY"; }
    if (d.error === "outside coverage") return "US ONLY";
    if (d.error) return "RETRY";
    return null;
  }

  var RUN = {
    aircraft: function(){ return get("/api/aircraft?" + q() + "&nm=" + S.nm).then(function(d){
      setLayer("aircraft", (d.aircraft || []).map(function(a){ return {id:a.icao, name:a.callsign, callsign:a.callsign, lat:a.lat, lon:a.lon, alt:a.alt, heading:a.heading, type:a.type}; }), d.error ? "RETRY" : null); }); },
    ships: function(){ return get("/api/ships?" + q()).then(function(d){ setLayer("ships", d.ships || [], errOf(d)); }); },
    osm_port: function(){ return osm("port", "ports"); },
    osm_cell: function(){ return osm("cell", "cell"); },
    osm_rail: function(){ return osm("rail", "rail"); },
    osm_portal: function(){ return osm("portal", "portal"); },
    mesh: function(){ return get("/api/mesh?" + q()).then(function(d){ setLayer("mesh", d.items || [], errOf(d)); }); },
    weather: function(){ return get("/api/weather?" + q()).then(function(d){ setLayer("weather", d.items || [], errOf(d)); }); },
    sats: function(){ return get("/api/sats?" + q()).then(function(d){
      var e = errOf(d);
      GROUPS.sats.layers.forEach(function(k){ if (S.on[k]) setLayer(k, (d.sats && d.sats[k]) || [], e); });
    }); }
  };
  function osm(kind, key){ return get("/api/osm?kind=" + kind + "&" + q()).then(function(d){ setLayer(key, d.items || [], errOf(d)); }); }

  function groupOn(g){ return GROUPS[g].layers.some(function(k){ return S.on[k]; }); }

  function runGroup(g){
    if (busy[g] || !loc || !groupOn(g)) return Promise.resolve();
    busy[g] = true;
    last[g] = Date.now();
    return RUN[g]().catch(function(){
      GROUPS[g].layers.forEach(function(k){ status[k] = "RETRY"; });
    }).then(function(){ busy[g] = false; save(); renderSide(); if (tab !== "MAP") renderPanes(); });
  }

  function tick(){
    if (!document.hidden && loc){
      var now = Date.now(), i = 0;
      Object.keys(GROUPS).forEach(function(g){
        if (!groupOn(g) || busy[g]) return;
        if (!last[g] || now - last[g] >= GROUPS[g].every * 1000){
          // stagger first loads so the relays are not hit all at once
          var wait = last[g] ? 0 : i++ * 700;
          last[g] = now;
          setTimeout(function(){ runGroup(g); }, wait);
        }
      });
    }
    renderBars();
  }

  // ---------- manual scan: wifi and bluetooth ----------
  function today(){ var d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  function scansLeft(){ if (S.scans.day !== today()){ S.scans = {day:today(), n:0}; } return DAILY_SCANS - S.scans.n; }

  $("scanBtn").onclick = function(){
    if (scanning) return;
    if (!loc){ toast("NO GPS LOCK YET", "", "#c97a00"); return; }
    if (scansLeft() <= 0){ toast("SCAN LIMIT " + DAILY_SCANS + " PER DAY", "", "#d6304a"); return; }
    scanning = true;
    S.scans.n++;
    var b = $("scanBtn"); b.className = "scan busy"; b.textContent = "SCANNING...";
    var jobs = [];
    ["wifi","bt"].forEach(function(k){
      if (!S.on[k]) return;
      jobs.push(get("/api/wigle?type=" + k + "&" + q()).then(function(d){
        var e = errOf(d);
        var near = (d.items || []).map(function(i){ return {id:i.id, name:i.name, lat:i.lat, lon:i.lon}; });
        if (e){ setLayer(k, [], e); return; }
        var have = {}; data[k].forEach(function(i){ have[i.id] = 1; });
        setLayer(k, data[k].concat(near.filter(function(i){ return !have[i.id]; })).slice(-300));
      }).catch(function(){ status[k] = "RETRY"; }));
    });
    Object.keys(GROUPS).forEach(function(g){ jobs.push(runGroup(g)); });
    Promise.all(jobs.concat([new Promise(function(r){ setTimeout(r, 1500); })])).then(function(){
      scanning = false; b.className = "scan"; b.textContent = "[ SCAN ]";
      toast("SCAN DONE  " + data.wifi.length + " WIFI  " + data.bt.length + " BT  " + scansLeft() + " LEFT TODAY", "", "#1e6fd9");
      save(); renderSide();
    });
  };

  // ---------- side panel ----------
  function renderSide(){
    $("sigs").innerHTML = LAYERS.map(function(l){
      var on = S.on[l.key], st = on ? status[l.key] : "OFF";
      var stColor = st === "OK" ? "var(--dim)" : st === "NO KEY" || st === "RETRY" ? "var(--red)" : "var(--amber)";
      return '<div class="sig'+(on?"":" off")+'" data-k="'+l.key+'" style="border-left-color:'+l.color+'"><b>'+l.label+'</b><i style="color:'+l.color+'">'+l.pts+'</i><s style="color:'+stColor+'">'+st+'</s><em style="color:'+l.color+'">'+data[l.key].length+'</em><div class="bar"><div id="bar_'+l.key+'" style="background:'+l.color+'"></div></div></div>';
    }).join("");
    Array.prototype.forEach.call($("sigs").children, function(el){
      el.onclick = function(){ toggle(el.getAttribute("data-k")); };
    });
    var rows = [
      ["SCORE", S.score.toLocaleString(), "var(--amber)"],
      ["SESSION", "+" + session.score.toLocaleString(), "var(--amber)"],
      ["FINDS", session.finds, "var(--blue)"],
      ["DISTANCE", fmtDist(session.dist), "var(--blue)"],
      ["SCANS LEFT", scansLeft(), "var(--blue)"],
      ["GPS", loc ? "LOCKED" : "SEARCHING", loc ? "var(--green)" : "var(--amber)"]
    ];
    $("sessionRows").innerHTML = rows.map(function(r){ return '<div class="row"><span>'+r[0]+'</span><span style="color:'+r[2]+'">'+r[1]+'</span></div>'; }).join("");
    $("score").textContent = S.score.toLocaleString() + " PTS";
    renderBars();
  }

  function renderBars(){
    var now = Date.now();
    LAYERS.forEach(function(l){
      var el = document.getElementById("bar_" + l.key);
      if (!el) return;
      var g = GROUPS[l.group];
      if (!g || !S.on[l.key] || !last[l.group]){ el.style.width = "0"; return; }
      el.style.width = Math.min(100, (now - last[l.group]) / (g.every * 10)) + "%";
    });
  }

  function toggle(k){
    S.on[k] = !S.on[k];
    if (S.on[k]){ groups[k].addTo(map); var g = BY[k].group; if (GROUPS[g]) { last[g] = 0; } }
    else { map.removeLayer(groups[k]); }
    save(); renderSide(); if (tab === "SETTINGS") renderPanes();
  }

  function fmtDist(m){ var mi = m / 1609.34; return mi < 0.1 ? Math.round(m * 3.281) + " FT" : mi.toFixed(2) + " MI"; }

  // ---------- tabs and panes ----------
  TABS.forEach(function(t){
    var b = document.createElement("button");
    b.className = "tab" + (t === tab ? " on" : "");
    b.textContent = t;
    b.onclick = function(){ setTab(t); };
    $("tabs").appendChild(b);
  });
  function setTab(t){
    tab = t;
    Array.prototype.forEach.call($("tabs").children, function(b){ b.className = "tab" + (b.textContent === t ? " on" : ""); });
    $("mapPane").className = "pane" + (t === "MAP" ? " on" : "");
    $("logPane").className = "pane" + (t === "LOGBOOK" ? " on" : "");
    $("badgePane").className = "pane" + (t === "BADGES" ? " on" : "");
    $("setPane").className = "pane" + (t === "SETTINGS" ? " on" : "");
    if (t === "MAP") setTimeout(function(){ map.invalidateSize(); }, 50);
    renderPanes();
  }

  function total(k){ return S.totals[k] || 0; }
  function kinds(){ return LAYERS.filter(function(l){ return total(l.key) > 0; }).length; }
  var BADGES = [
    {name:"FIRST CONTACT", desc:"Log anything", test:function(){ return S.log.length >= 1; }},
    {name:"SPOTTER", desc:"Log ten aircraft", test:function(){ return total("aircraft") >= 10; }},
    {name:"AIR TRAFFIC", desc:"Log one hundred aircraft", test:function(){ return total("aircraft") >= 100; }},
    {name:"LOW PASS", desc:"Log an aircraft under three thousand feet", test:function(){ return S.log.some(function(l){ return l.k === "aircraft" && l.alt > 0 && l.alt < 3000; }); }},
    {name:"HARBOR MASTER", desc:"Log ten ships", test:function(){ return total("ships") >= 10; }},
    {name:"ORBITAL", desc:"Log fifty satellites of any kind", test:function(){ return total("starlink") + total("gps_sat") + total("weather_sat") + total("debris") + total("rocket") >= 50; }},
    {name:"JUNK COLLECTOR", desc:"Log ten pieces of debris or rocket bodies", test:function(){ return total("debris") + total("rocket") >= 10; }},
    {name:"WARDRIVER", desc:"Log one hundred Wi-Fi networks", test:function(){ return total("wifi") >= 100; }},
    {name:"MESH NODE", desc:"Log a Meshtastic node", test:function(){ return total("mesh") >= 1; }},
    {name:"FULL SPECTRUM", desc:"Log something from ten different layers", test:function(){ return kinds() >= 10; }},
    {name:"ROAD WARRIOR", desc:"Travel one hundred miles with the app open", test:function(){ return S.dist >= 160934; }},
    {name:"NIGHT SHIFT", desc:"Log anything between midnight and five", test:function(){ return S.log.some(function(l){ return new Date(l.t).getHours() < 5; }); }},
    {name:"FIVE GRAND", desc:"Reach five thousand points", test:function(){ return S.score >= 5000; }},
    {name:"FIFTY GRAND", desc:"Reach fifty thousand points", test:function(){ return S.score >= 50000; }}
  ];

  function renderPanes(){
    if (tab === "LOGBOOK"){
      var h = '<div class="card"><h3>// LOGBOOK</h3>';
      if (!S.log.length) h += '<div class="empty">Finds land here the first time they show up in range.</div>';
      S.log.slice(0, 200).forEach(function(l){
        var L1 = BY[l.k] || {label:l.k, color:"#6b7a8c"}, d = new Date(l.t);
        h += '<div class="log"><div><span class="chip" style="background:'+L1.color+'">'+esc(L1.label)+'</span><b>'+esc(l.name)+'</b><small>'+d.toLocaleDateString()+' '+d.toLocaleTimeString()+'</small></div><div style="color:var(--amber);font-weight:700">+'+l.pts+'</div></div>';
      });
      $("logPane").innerHTML = h + '</div>';
    }
    if (tab === "BADGES"){
      var b = '<div class="card"><h3>// BADGES</h3>';
      BADGES.forEach(function(x){
        var got = x.test();
        b += '<div class="badge'+(got?" got":"")+'"><div class="medal">'+(got?"&#9733;":"?")+'</div><div><b>'+x.name+'</b><small>'+x.desc+'</small></div></div>';
      });
      b += '</div><div class="card"><h3>// LIFETIME TOTALS</h3>';
      LAYERS.forEach(function(l){ b += '<div class="row"><span>'+l.label+'</span><span style="color:'+l.color+'">'+total(l.key)+'</span></div>'; });
      b += '<div class="row"><span>DISTANCE</span><span style="color:var(--blue)">'+fmtDist(S.dist)+'</span></div>';
      $("badgePane").innerHTML = b + '</div>';
    }
    if (tab === "SETTINGS"){
      var o = '<div class="card"><h3>// SETTINGS</h3>';
      o += '<div class="opt"><span>AIRCRAFT REFRESH</span><select id="airSel">'+[15,20,30,60].map(function(v){ return '<option value="'+v+'"'+(S.air===v?" selected":"")+'>'+v+' SEC</option>'; }).join("")+'</select></div>';
      o += '<div class="opt"><span>AIRCRAFT RANGE</span><select id="nmSel">'+[25,60,120].map(function(v){ return '<option value="'+v+'"'+(S.nm===v?" selected":"")+'>'+v+' NM</option>'; }).join("")+'</select></div>';
      o += '<div class="opt"><span>MAP FOLLOWS ME</span><select id="folSel"><option value="1"'+(S.follow?" selected":"")+'>ON</option><option value="0"'+(S.follow?"":" selected")+'>OFF</option></select></div>';
      o += '<div class="opt"><span>WIPE LOGBOOK AND SCORE</span><button class="btn" id="wipeBtn">WIPE</button></div>';
      o += '<div class="opt"><span>BUILD</span><span style="color:var(--blue)">'+VERSION+'</span></div></div>';
      o += '<div class="card"><h3>// FEEDS</h3>';
      LAYERS.forEach(function(l){
        var st = S.on[l.key] ? status[l.key] : "OFF";
        o += '<div class="row"><span>'+l.label+'</span><span style="color:'+(st==="OK"?"var(--green)":st==="OFF"?"var(--dim)":"var(--red)")+'">'+st+'</span></div>';
      });
      var miss = Object.keys(missing);
      if (miss.length) o += '<div class="empty">Server keys not set yet: '+miss.join(", ")+'</div>';
      $("setPane").innerHTML = o + '</div>';
      $("airSel").onchange = function(){ S.air = parseInt(this.value, 10); GROUPS.aircraft.every = S.air; save(); };
      $("nmSel").onchange = function(){ S.nm = parseInt(this.value, 10); save(); runGroup("aircraft"); };
      $("folSel").onchange = function(){ S.follow = this.value === "1"; save(); };
      $("wipeBtn").onclick = function(){
        if (!confirm("Wipe the logbook and score?")) return;
        var on = S.on; S = fresh(); S.on = on; save();
        session = {score:0, finds:0, start:Date.now(), dist:0};
        renderSide(); renderPanes();
      };
    }
  }

  // ---------- gps ----------
  function hav(a, b){
    var R = 6371000, r = Math.PI / 180;
    var dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
    var x = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLon/2) * Math.sin(dLon/2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }

  if (navigator.geolocation){
    navigator.geolocation.watchPosition(function(pos){
      var first = !loc;
      loc = {lat:pos.coords.latitude, lon:pos.coords.longitude};
      if (lastPos && pos.coords.accuracy < 60){
        var m = hav(lastPos, loc);
        if (m > 15 && m < 5000){ session.dist += m; S.dist += m; lastPos = loc; save(); }
      } else if (!lastPos) lastPos = loc;
      $("gpsDot").className = "dot live";
      $("gpsText").innerHTML = '<span style="color:var(--green)">LIVE</span><span class="coords">&nbsp;'+loc.lat.toFixed(4)+'&deg; '+loc.lon.toFixed(4)+'&deg;</span>';
      $("acq").style.display = "none";
      if (!me) me = L.marker([loc.lat, loc.lon], {icon:meIcon(), zIndexOffset:1000}).addTo(map);
      else me.setLatLng([loc.lat, loc.lon]);
      if (first) map.setView([loc.lat, loc.lon], 12);
      else if (S.follow) map.panTo([loc.lat, loc.lon], {animate:true});
      if (first){ renderSide(); tick(); }
    }, function(){
      $("acq").innerHTML = 'NO GPS<small>LOCATION ACCESS WAS BLOCKED</small>';
    }, {enableHighAccuracy:true, maximumAge:5000});
  }
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) tick(); });

  renderSide();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
